<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Data Mahasiswa</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 30px;
      max-width: 600px;
      margin: 0 auto;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: inline-block;
      width: 80px;
      font-weight: bold;
    }
    input[type="text"] {
      padding: 8px;
      width: 250px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      padding: 8px 16px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
    .btn-action {
      background-color: #28a745;
      margin-top: 10px;
    }
    .btn-action:hover {
      background-color: #218838;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    th, td {
      border: 1px solid #aaa;
      padding: 10px;
      text-align: left;
    }
    th {
      background-color: #f2f2f2;
    }
  </style>
</head>
<body>

  <h2>Input Data Mahasiswa</h2>

  <!-- Form Input -->
  <div class="form-group">
    <label for="nim">NIM:</label>
    <input type="text" id="nim" placeholder="Masukkan NIM">
  </div>
  <div class="form-group">
    <label for="nama">Nama:</label>
    <input type="text" id="nama" placeholder="Masukkan Nama">
  </div>
  <button id="btnTambah">Add</button>

  <hr style="margin-top:25px;">

  <!-- Tombol Backup Data -->
  <div>
    <button id="btnExport" class="btn-action">Download Backup Data</button>
    <input type="file" id="inputImport" accept=".json" style="display:none;">
    <button id="btnImport" class="btn-action" style="background-color: #6c757d;">Upload File Backup</button>
  </div>

  <!-- Tabel Penampung Data -->
  <table>
    <thead>
      <tr>
        <th>NIM</th>
        <th>NAMA</th>
      </tr>
    </thead>
    <tbody id="tabelData">
      <!-- Data bertambah di sini -->
    </tbody>
  </table>

  <script>
    const btnTambah = document.getElementById('btnTambah');
    const inputNim = document.getElementById('nim');
    const inputNama = document.getElementById('nama');
    const tabelData = document.getElementById('tabelData');
    const btnExport = document.getElementById('btnExport');
    const btnImport = document.getElementById('btnImport');
    const inputImport = document.getElementById('inputImport');

    // 1. Load data saat halaman dibuka
    function muatData() {
      tabelData.innerHTML = '';
      const dataMahasiswa = JSON.parse(localStorage.getItem('dataMahasiswa')) || [];
      dataMahasiswa.forEach(item => tambahBarisKeTabel(item.nim, item.nama));
    }

    function tambahBarisKeTabel(nim, nama) {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${nim}</td><td>${nama}</td>`;
      tabelData.appendChild(tr);
    }

    muatData();

    // 2. Tambah data baru
    btnTambah.addEventListener('click', () => {
      const nim = inputNim.value.trim();
      const nama = inputNama.value.trim();

      if (!nim || !nama) {
        alert('NIM dan Nama wajib diisi!');
        return;
      }

      const dataMahasiswa = JSON.parse(localStorage.getItem('dataMahasiswa')) || [];
      dataMahasiswa.push({ nim, nama });
      localStorage.setItem('dataMahasiswa', JSON.stringify(dataMahasiswa));

      tambahBarisKeTabel(nim, nama);
      inputNim.value = '';
      inputNama.value = '';
      inputNim.focus();
    });

    // 3. Export Data ke File JSON
    btnExport.addEventListener('click', () => {
      const data = localStorage.getItem('dataMahasiswa') || '[]';
      const blob = new Blob([data], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'data_mahasiswa.json';
      a.click();
    });

    // 4. Import Data dari File JSON
    btnImport.addEventListener('click', () => inputImport.click());

    inputImport.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          const importedData = JSON.parse(event.target.result);
          localStorage.setItem('dataMahasiswa', JSON.stringify(importedData));
          muatData();
          alert('Data berhasil dimuat!');
        } catch (err) {
          alert('Format file JSON tidak valid!');
        }
      };
      reader.readAsText(file);
    });
  </script>

</body>
</html>
