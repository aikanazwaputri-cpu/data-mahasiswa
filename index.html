<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Data Mahasiswa</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 30px;
      max-width: 600px;
      margin: 0 auto;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: inline-block;
      width: 80px;
      font-weight: bold;
    }
    input[type="text"] {
      padding: 8px;
      width: 250px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      padding: 8px 16px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      margin-left: 84px;
    }
    button:hover {
      background-color: #0056b3;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 30px;
    }
    th, td {
      border: 1px solid #aaa;
      padding: 10px;
      text-align: left;
    }
    th {
      background-color: #f2f2f2;
    }
  </style>
</head>
<body>

  <h2>Input Data Mahasiswa</h2>

  <!-- Form Input -->
  <div class="form-group">
    <label for="nim">NIM:</label>
    <input type="text" id="nim" placeholder="Masukkan NIM">
  </div>
  <div class="form-group">
    <label for="nama">Nama:</label>
    <input type="text" id="nama" placeholder="Masukkan Nama">
  </div>
  <button id="btnTambah">Add</button>

  <!-- Tabel Penampung Data -->
  <table>
    <thead>
      <tr>
        <th>NIM</th>
        <th>NAMA</th>
      </tr>
    </thead>
    <tbody id="tabelData">
      <!-- Data baru akan bertambah di sini -->
    </tbody>
  </table>

  <script>
    const btnTambah = document.getElementById('btnTambah');
    const inputNim = document.getElementById('nim');
    const inputNama = document.getElementById('nama');
    const tabelData = document.getElementById('tabelData');

    // 1. Load data dari localStorage saat halaman dibuka
    function muatData() {
      tabelData.innerHTML = '';
      const dataMahasiswa = JSON.parse(localStorage.getItem('dataMahasiswa')) || [];
      dataMahasiswa.forEach(function(item) {
        tambahBarisKeTabel(item.nim, item.nama);
      });
    }

    // 2. Fungsi menambahkan baris ke tabel
    function tambahBarisKeTabel(nim, nama) {
      const trBaru = document.createElement('tr');

      const tdNim = document.createElement('td');
      tdNim.textContent = nim;

      const tdNama = document.createElement('td');
      tdNama.textContent = nama;

      trBaru.appendChild(tdNim);
      trBaru.appendChild(tdNama);

      tabelData.appendChild(trBaru);
    }

    // Tampilkan data yang tersimpan saat pertama kali halaman dimuat
    muatData();

    // 3. Simpan data baru ke localStorage saat tombol "Add" diklik
    btnTambah.addEventListener('click', function() {
      const nimValue = inputNim.value.trim();
      const namaValue = inputNama.value.trim();

      if (nimValue === '' || namaValue === '') {
        alert('NIM dan Nama tidak boleh kosong!');
        return;
      }

      const dataMahasiswa = JSON.parse(localStorage.getItem('dataMahasiswa')) || [];
      dataMahasiswa.push({ nim: nimValue, nama: namaValue });
      localStorage.setItem('dataMahasiswa', JSON.stringify(dataMahasiswa));

      tambahBarisKeTabel(nimValue, namaValue);

      inputNim.value = '';
      inputNama.value = '';
      inputNim.focus();
    });
  </script>

</body>
</html>
